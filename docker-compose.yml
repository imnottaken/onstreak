services:
  onstreak:
    build: .
    ports: ["8787:8787"]
    environment:
      ONSTREAK_API_KEY: change-me-to-a-long-secret
      DATABASE_URL: postgres://onstreak:onstreak@db:5432/onstreak
    depends_on:
      db:
        # Wait until Postgres accepts connections, not just until it starts.
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: onstreak
      POSTGRES_PASSWORD: onstreak
      POSTGRES_DB: onstreak
    volumes: ["onstreak-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onstreak -d onstreak"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  onstreak-data:
