name: Feature request
description: Suggest an idea for onstreak
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or use case, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working. Check ROADMAP.md, it may be planned.
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
