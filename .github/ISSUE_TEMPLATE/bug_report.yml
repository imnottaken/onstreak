name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest config and requests that show the problem.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: onstreak version
      placeholder: "0.1.0 (from onstreak --version)"
    validations:
      required: true
  - type: dropdown
    id: store
    attributes:
      label: Store
      options: [Postgres, Supabase, Neon, In-memory, Other]
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant server log lines. Include the x-request-id if you have one. Remove secrets.
      render: text
